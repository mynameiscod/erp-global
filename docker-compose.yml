# Full stack for a single server (Hostinger VPS or any Docker host).
#   node infra/scripts/gen-env.mjs --prod   # creates .env.production with random secrets
#   docker compose --env-file .env.production up -d --build
# Only the web container (Nginx) is published; everything else stays on the internal network.

x-service: &service
  restart: unless-stopped
  networks: [internal]
  depends_on:
    mongo-init:
      condition: service_completed_successfully
    nats:
      condition: service_healthy

x-service-env: &service-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  NATS_URL: nats://nats:4222
  JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
  INTERNAL_SECRET: ${INTERNAL_SECRET}
  TENANT_SERVICE_URL: http://tenant-service:3002
  ENABLE_DOCS: ${ENABLE_DOCS:-false}

x-build: &build
  context: .
  dockerfile: infra/docker/Dockerfile.service

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    entrypoint: ['/bin/bash', '/entrypoint.sh']
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_KEYFILE: ${MONGO_KEYFILE}
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./infra/docker/mongo/entrypoint.sh:/entrypoint.sh:ro
    networks: [internal]
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  mongo-init:
    image: mongo:7.0
    restart: 'no'
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_PASSWORD_IDENTITY: ${MONGO_PASSWORD_IDENTITY}
      MONGO_PASSWORD_TENANT: ${MONGO_PASSWORD_TENANT}
      MONGO_PASSWORD_ORG: ${MONGO_PASSWORD_ORG}
      MONGO_PASSWORD_ACCESS: ${MONGO_PASSWORD_ACCESS}
      MONGO_PASSWORD_AUDIT: ${MONGO_PASSWORD_AUDIT}
      MONGO_PASSWORD_REFERENCE: ${MONGO_PASSWORD_REFERENCE}
      MONGO_PASSWORD_NOTIFICATION: ${MONGO_PASSWORD_NOTIFICATION}
      MONGO_PASSWORD_CONFIG: ${MONGO_PASSWORD_CONFIG}
      MONGO_PASSWORD_RECORDS: ${MONGO_PASSWORD_RECORDS}
      MONGO_PASSWORD_FILES: ${MONGO_PASSWORD_FILES}
      MONGO_PASSWORD_PROVISIONER: ${MONGO_PASSWORD_PROVISIONER}
    command: >
      mongosh --quiet --host mongo -u root -p ${MONGO_ROOT_PASSWORD} --authenticationDatabase admin
      /init.js
    volumes:
      - ./infra/docker/mongo/init.js:/init.js:ro
    networks: [internal]

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ['-js', '-sd', '/data', '-m', '8222']
    volumes: [nats-data:/data]
    networks: [internal]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8222/healthz']
      interval: 10s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes']
    volumes: [redis-data:/data]
    networks: [internal]

  # S3-compatible storage for file and image fields (SeaweedFS). Internal only: files are served through file-service.
  s3:
    image: chrislusf/seaweedfs:4.47
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/entrypoint.sh']
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - s3-data:/data
      - ./infra/docker/s3/entrypoint.sh:/entrypoint.sh:ro
    networks: [internal]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9333/cluster/status']
      interval: 10s
      timeout: 5s
      retries: 12

  config-service:
    <<: *service
    build: { <<: *build, args: { APP: config-service } }
    environment:
      <<: *service-env
      PORT: 3008
      MONGO_URI: mongodb://svc_config:${MONGO_PASSWORD_CONFIG}@mongo:27017/?replicaSet=rs0&authSource=admin
      MONGO_DB: erp_config
      ORG_SERVICE_URL: http://org-service:3003

  records-service:
    <<: *service
    build: { <<: *build, args: { APP: records-service } }
    environment:
      <<: *service-env
      PORT: 3009
      MONGO_URI: mongodb://svc_records:${MONGO_PASSWORD_RECORDS}@mongo:27017/?replicaSet=rs0&authSource=admin
      MONGO_DB: erp_records
      CONFIG_SERVICE_URL: http://config-service:3008
      ORG_SERVICE_URL: http://org-service:3003
      IDENTITY_SERVICE_URL: http://identity-service:3001
      FILE_SERVICE_URL: http://file-service:3010

  file-service:
    <<: *service
    build: { <<: *build, args: { APP: file-service } }
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      s3:
        condition: service_healthy
    environment:
      <<: *service-env
      PORT: 3010
      MONGO_URI: mongodb://svc_files:${MONGO_PASSWORD_FILES}@mongo:27017/?replicaSet=rs0&authSource=admin
      MONGO_DB: erp_files
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: erp-files
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      MAX_UPLOAD_MB: 25

  identity-service:
    <<: *service
    build: { <<: *build, args: { APP: identity-service } }
    environment:
      <<: *service-env
      PORT: 3001
      MONGO_URI: mongodb://svc_identity:${MONGO_PASSWORD_IDENTITY}@mongo:27017/?replicaSet=rs0&authSource=admin
      MONGO_DB: erp_identity
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      DATA_ENC_KEY: ${DATA_ENC_KEY}
      ACCESS_SERVICE_URL: http://access-service:3004
      CONFIG_SERVICE_URL: http://config-service:3008
      APP_URL: ${APP_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY_HOPS: 2
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD}
      # Google / Microsoft sign-in (optional). Redirect URL: ${APP_URL}/api/v1/identity/sso/<google|microsoft>/callback
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}

  tenant-service:
    <<: *service
    build: { <<: *build, args: { APP: tenant-service } }
    environment:
      <<: *service-env
      PORT: 3002
      TENANT_SERVICE_URL: self
      MONGO_URI: mongodb://svc_tenant:${MONGO_PASSWORD_TENANT}@mongo:27017/?replicaSet=rs0&authSource=admin
      MONGO_DB: erp_tenant
      DB_ADMIN_URI: mongodb://svc_provisioner:${MONGO_PASSWORD_PROVISIONER}@mongo:27017/?replicaSet=rs0&authSource=admin
      ORG_SERVICE_URL: http://org-service:3003
      IDENTITY_SERVICE_URL: http://identity-service:3001
      ACCESS_SERVICE_URL: http://access-service:3004
      REFERENCE_SERVICE_URL: http://reference-data-service:3006

  org-service:
    <<: *service
    build: { <<: *build, args: { APP: org-service } }
    environment:
      <<: *service-env
      PORT: 3003
      MONGO_URI: mongodb://svc_org:${MONGO_PASSWORD_ORG}@mongo:27017/?replicaSet=rs0&authSource=admin
      MONGO_DB: erp_org
      CONFIG_SERVICE_URL: http://config-service:3008

  access-service:
    <<: *service
    build: { <<: *build, args: { APP: access-service } }
    environment:
      <<: *service-env
      PORT: 3004
      MONGO_URI: mongodb://svc_access:${MONGO_PASSWORD_ACCESS}@mongo:27017/?replicaSet=rs0&authSource=admin
      MONGO_DB: erp_access
      ORG_SERVICE_URL: http://org-service:3003
      IDENTITY_SERVICE_URL: http://identity-service:3001
      CONFIG_SERVICE_URL: http://config-service:3008

  audit-service:
    <<: *service
    build: { <<: *build, args: { APP: audit-service } }
    environment:
      <<: *service-env
      PORT: 3005
      MONGO_URI: mongodb://svc_audit:${MONGO_PASSWORD_AUDIT}@mongo:27017/?replicaSet=rs0&authSource=admin
      MONGO_DB: erp_audit

  reference-data-service:
    <<: *service
    build: { <<: *build, args: { APP: reference-data-service } }
    environment:
      <<: *service-env
      PORT: 3006
      MONGO_URI: mongodb://svc_reference:${MONGO_PASSWORD_REFERENCE}@mongo:27017/?replicaSet=rs0&authSource=admin
      MONGO_DB: erp_reference

  notification-service:
    <<: *service
    build: { <<: *build, args: { APP: notification-service } }
    environment:
      <<: *service-env
      PORT: 3007
      MONGO_URI: mongodb://svc_notification:${MONGO_PASSWORD_NOTIFICATION}@mongo:27017/?replicaSet=rs0&authSource=admin
      MONGO_DB: erp_notification
      MAIL_TRANSPORT: smtp
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      # WhatsApp Cloud API (optional). Without it, codes can still be sent by email.
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_OTP_TEMPLATE: ${WHATSAPP_OTP_TEMPLATE:-otp_code}
      WHATSAPP_TEMPLATE_LANGUAGES: ${WHATSAPP_TEMPLATE_LANGUAGES:-en_US}

  api-gateway:
    restart: unless-stopped
    networks: [internal]
    build: { <<: *build, args: { APP: api-gateway } }
    depends_on:
      [
        identity-service,
        tenant-service,
        org-service,
        access-service,
        audit-service,
        reference-data-service,
        config-service,
        records-service,
        file-service,
        redis,
      ]
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      CORS_ORIGINS: ${APP_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      TRUST_PROXY_HOPS: 1
      IDENTITY_SERVICE_URL: http://identity-service:3001
      TENANT_SERVICE_URL: http://tenant-service:3002
      ORG_SERVICE_URL: http://org-service:3003
      ACCESS_SERVICE_URL: http://access-service:3004
      AUDIT_SERVICE_URL: http://audit-service:3005
      REFERENCE_SERVICE_URL: http://reference-data-service:3006
      CONFIG_SERVICE_URL: http://config-service:3008
      RECORDS_SERVICE_URL: http://records-service:3009
      FILE_SERVICE_URL: http://file-service:3010

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    depends_on: [api-gateway]
    ports: ['${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80']
    networks: [internal]

networks:
  internal:

volumes:
  mongo-data:
  mongo-config:
  nats-data:
  redis-data:
  s3-data:
