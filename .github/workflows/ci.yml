name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MONGOMS_VERSION: 7.0.24
  MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries

jobs:
  verify:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache MongoDB test binary
        uses: actions/cache@v4
        with:
          path: ${{ env.MONGOMS_DOWNLOAD_DIR }}
          key: mongodb-${{ runner.os }}-${{ env.MONGOMS_VERSION }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # Includes the end-to-end acceptance test (tests/e2e): all services + gateway,
      # tenant isolation, audit chain verification.
      - run: pnpm turbo run test --concurrency=2

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          node infra/scripts/gen-env.mjs --prod
          docker compose --env-file .env.production config --quiet
          docker compose -f docker-compose.dev.yml config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build all images
        run: docker compose --env-file .env.production build
